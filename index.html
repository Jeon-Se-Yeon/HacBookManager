<!doctype html>
<html lang="ko" data-theme="dark" data-theme-preset="default" data-bg-custom="false">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAC Book Manager | 서적 관리</title>
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('hac_theme_settings') || '{}');
          var preset = s.preset === 'light' || s.preset === 'custom' ? s.preset : 'dark';
          var appearance = preset === 'light' ? 'light' : preset === 'custom' && s.customBase === 'light' ? 'light' : 'dark';
          var url = typeof s.backgroundImageUrl === 'string' ? s.backgroundImageUrl.trim() : '';
          var useBg = preset === 'custom' && url;
          document.documentElement.dataset.theme = appearance;
          document.documentElement.dataset.themePreset = preset === 'custom' ? 'custom' : 'default';
          document.documentElement.dataset.bgCustom = useBg ? 'true' : 'false';
          if (useBg) {
            document.documentElement.style.setProperty('--app-bg-image', 'url("' + url.replace(/"/g, '\\"') + '")');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
